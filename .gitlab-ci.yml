# =========================================================
# CI/CD jhic-frontend
# Runner: GitLab Runner dengan tag "jhic" (shell executor,
# Docker sudah terpasang di host runner)
# Alur: build image -> deploy (run container di port 3000)
#
# Arsitektur deploy:
#   nginx server (config existing di host, port 80/443)
#     -> proxy_pass http://localhost:3000
#     -> container jhic-frontend (nginx internal listen 3000)
# CI ini tidak mengubah/menyentuh config nginx yang ada di server.
# =========================================================

stages:
  - build
  - deploy

variables:
  IMAGE_NAME: "jhic-frontend"
  IMAGE_TAG: "latest"
  CONTAINER_NAME: "jhic-frontend"
  APP_PORT: "3000"

# ---------- Job 1: Build image aplikasi ----------
build-app:
  stage: build
  tags:
    - jhic
  script:
    - echo "Building Docker image $IMAGE_NAME:$IMAGE_TAG ..."
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - echo "Build selesai -> $IMAGE_NAME:$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ---------- Job 2: Deploy (run container di port 3000) ----------
# Container hanya menjalankan aplikasi di port 3000.
# Nginx existing di server tinggal diarahkan (proxy_pass) ke localhost:3000.
deploy-app:
  stage: deploy
  tags:
    - jhic
  script:
    - echo "Menjalankan container $CONTAINER_NAME di port $APP_PORT ..."
    # Hentikan & hapus container lama jika ada
    - docker rm -f $CONTAINER_NAME 2>/dev/null || true
    # Jalankan container baru dari image hasil build
    - docker run -d --name $CONTAINER_NAME --restart unless-stopped -p ${APP_PORT}:${APP_PORT} $IMAGE_NAME:$IMAGE_TAG
    # Verifikasi container berjalan dan aplikasi merespons
    - docker ps --filter "name=$CONTAINER_NAME"
    - sleep 3
    - curl -sf http://localhost:${APP_PORT} > /dev/null && echo "Aplikasi berjalan di http://localhost:${APP_PORT}"
    # Bersihkan layer/image lama yang tidak terpakai
    - docker image prune -f
  environment:
    name: production
    url: http://localhost:3000
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

